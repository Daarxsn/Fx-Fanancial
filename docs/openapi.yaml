openapi: 3.1.0
info:
  title: Falchion Invoice API
  version: 1.0.0
  description: Initial internal API contract. Planned endpoints are not implemented merely by being listed here.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Customers
  - name: Invoices
  - name: Payments
paths:
  /health:
    get:
      tags: [Health]
      summary: Check application/database readiness
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Application and database are responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      operationId: listCustomers
      security:
        - sessionAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Customer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Customers]
      summary: Create a customer
      operationId: createCustomer
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      operationId: listInvoices
      security:
        - sessionAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, ISSUED, CANCELLED]
        - in: query
          name: customerId
          schema: { $ref: "#/components/schemas/Uuid" }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Invoice page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Invoices]
      summary: Create an invoice draft
      operationId: createInvoiceDraft
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceDraftInput"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /invoices/{invoiceId}:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      tags: [Invoices]
      summary: Get invoice details
      operationId: getInvoice
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /invoices/{invoiceId}/issue:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    post:
      tags: [Invoices]
      summary: Issue a draft invoice transactionally
      operationId: issueInvoice
      security:
        - sessionAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      responses:
        "200":
          description: Existing issuance result for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /invoices/{invoiceId}/payments:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      tags: [Payments]
      summary: List payment allocations for an invoice
      operationId: listInvoicePayments
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Payment allocation list
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentAllocation"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: Session token
      description: Placeholder contract. Select and implement authentication before enabling protected routes.
  parameters:
    InvoiceId:
      in: path
      name: invoiceId
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  schemas:
    Uuid:
      type: string
      format: uuid
    Money:
      type: string
      pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
      description: Exact decimal string; authoritative arithmetic uses server decimal arithmetic and database DECIMAL.
    Meta:
      type: object
      properties:
        requestId: { type: string }
        nextCursor: { type: [string, "null"] }
    HealthResponse:
      type: object
      required: [status, checks, checkedAt]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok, error] }
        checkedAt: { type: string, format: date-time }
    CustomerInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: [string, "null"], format: email, maxLength: 320 }
        phone: { type: [string, "null"], maxLength: 50 }
        billingAddress:
          type: [object, "null"]
          additionalProperties: true
        taxIdentifier: { type: [string, "null"], maxLength: 100 }
        notes: { type: [string, "null"], maxLength: 5000 }
    Customer:
      allOf:
        - $ref: "#/components/schemas/CustomerInput"
        - type: object
          required: [id, isActive, createdAt, updatedAt]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            isActive: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CustomerResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Customer" }
        meta: { $ref: "#/components/schemas/Meta" }
    CustomerListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        meta: { $ref: "#/components/schemas/Meta" }
    InvoiceLineInput:
      type: object
      additionalProperties: false
      required: [description, quantity, unitPrice]
      properties:
        description: { type: string, minLength: 1, maxLength: 1000 }
        quantity: { $ref: "#/components/schemas/Money" }
        unitPrice: { $ref: "#/components/schemas/Money" }
        discountAmount: { $ref: "#/components/schemas/Money" }
        taxRate: { $ref: "#/components/schemas/Money" }
    InvoiceDraftInput:
      type: object
      additionalProperties: false
      required: [legalEntityId, customerId, currency, lines]
      properties:
        legalEntityId: { $ref: "#/components/schemas/Uuid" }
        brandId: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        customerId: { $ref: "#/components/schemas/Uuid" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        invoiceDate: { oneOf: [{ type: string, format: date }, { type: "null" }] }
        paymentTermsDays: { type: integer, minimum: 0, maximum: 3650 }
        notes: { type: [string, "null"], maxLength: 5000 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/InvoiceLineInput" }
    Invoice:
      type: object
      required: [id, lifecycleStatus, currency, grandTotal, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        invoiceNumber: { type: [string, "null"] }
        lifecycleStatus: { type: string, enum: [DRAFT, ISSUED, CANCELLED] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotal: { $ref: "#/components/schemas/Money" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        taxTotal: { $ref: "#/components/schemas/Money" }
        grandTotal: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InvoiceResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Invoice" }
        meta: { $ref: "#/components/schemas/Meta" }
    InvoiceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        meta: { $ref: "#/components/schemas/Meta" }
    PaymentAllocation:
      type: object
      required: [id, paymentId, invoiceId, amount, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        paymentId: { $ref: "#/components/schemas/Uuid" }
        invoiceId: { $ref: "#/components/schemas/Uuid" }
        amount: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
            requestId: { type: string }
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Domain validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
